<header class="page-head">
  <h1 class="page-title">Your profile</h1>
  <p class="page-sub">The account you're signed in with.</p>
</header>

<section class="panel">
  @if (user(); as u) {
    <dl class="profile">
      <dt>Display name</dt>
      <dd>{{ u.displayName }}</dd>
      <dt>Email</dt>
      <dd>{{ u.email }}</dd>
      <dt>User ID</dt>
      <dd class="mono">{{ u.id }}</dd>
      <dt>Member since</dt>
      <dd>{{ u.createdAt | date: 'medium' }}</dd>
    </dl>
  }
</section>
