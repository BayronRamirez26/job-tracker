name: CI

# Build and test every service on each push / PR to main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # Linux runner: Docker is available, so Testcontainers works
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          # Installs the exact SDK pinned by the repo's global.json (.NET 8).
          global-json-file: global.json

      - name: Applications — build & test (unit + Testcontainers integration)
        working-directory: services/applications
        run: dotnet test JobTracker.Applications.sln -c Release

      - name: Users — build & test (unit + Testcontainers integration)
        working-directory: services/users
        run: dotnet test JobTracker.Users.sln -c Release

      - name: AI — build & test (unit + integration; AI client stubbed, no key needed)
        working-directory: services/ai
        run: dotnet test JobTracker.AI.sln -c Release

      - name: Gateway — build
        working-directory: services/gateway
        run: dotnet build JobTracker.Gateway.sln -c Release
